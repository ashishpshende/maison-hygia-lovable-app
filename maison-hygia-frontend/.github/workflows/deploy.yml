name: Deploy to Hostinger

on:
  push:
    branches:
      - main  # Change to master if your main branch is named master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build production bundle
        run: npm run build

      - name: 🚀 Sync files via FTP
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/   # Target path on Hostinger
          local-dir: ./dist/          # Source folder generated by Vite/React
          dangerous-clean-slate: false # Set to true ONLY if you want to wipe destination before sync